<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Cellular Automaton</title>
  <link rel="stylesheet" href="src/color.css">
</head>
<body>
  <div id="controls-wrapper">
    <div id="controls">
      <div class="center-controls">
        <!-- <label for="shape-select">Starting Shape:</label>
        <select id="shape-select">
          <option value="random">Random</option>
          <option value="cube">Cube</option>
          <option value="tetrahedron">Tetrahedron</option>
        </select> -->
        <div class="button-group">
          <div id="controls-time" class="control-group">
            <div class="top-row">
              <button id="playPauseButton" class="glass-button">
                <span id="playPauseIcon" class="play"></span>
              </button>
              <button id="reverseButton" class="glass-button">
                <span id="leftArrow" class="arrow">&larr;</span>
                <span id="rightArrow" class="arrow">&rarr;</span>
              </button>
            </div>
            <div class="bottom-row">
              <button id="stepButton" class="glass-button">
                <svg id="stepIcon" width="40" height="16" viewBox="0 0 40 16" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="5" cy="8" r="5" fill="currentColor"/>
                  <line x1="10" y1="8" x2="30" y2="8" stroke="currentColor" stroke-width="2"/>
                  <circle cx="35" cy="8" r="5" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>
          <!-- <div id="controls-time">
            <button id="directionButton" class="glass-button">
              <span id="directionIcon">⏩</span>
            </button>
          </div> -->
          <div id="dualStateButton" class="multi-section-button state-active-x">
            <div class="state-section section-x state-active-x active" data-value="full" data-id="x">3D</div>
            <div class="state-section section-y" data-value="slice" data-id="y">2D</div>
          </div>
          <div id="triStateButton" class="multi-section-button state-active-x">
            <div class="state-section section-x state-active-x active" data-value="x">X</div>
            <div class="state-section section-y" data-value="y">Y</div>
            <div class="state-section section-z" data-value="z">Z</div>
          </div>
        </div>
        <div id="slider">
          <label class="slice-label">
            <input type="range" id="slice-index" class="glass-slider" min="0" max="49" value="25" />
          </label>
        </div>
        <div id="speed-slider">
          <label class="slice-label">
            <input
              type="range"
              id="speed-control"
              class="glass-slider"
              min=".1"
              max="20"
              step="0.1"
              value=".1"
            />
          </label>
        </div>
      </div>
    </div>
  </div>
  <!-- <canvas id="clockCanvas" width="150" height="150"></canvas> -->
  <div class="glass-display-container">
    <div class="glass-display">
      <h3 id="gen-display">Generation</h3>
      <h1 id="gen">0</h3>
    </div>
    <div id="sliceViewer" class="glass-display">
      <h3 id="slice-display">Slice</h3>
      <h1 id="slice-value">#</h1>
    </div>
    <div class="glass-display">
      <h3 id="fps-display">FPS</h3>
      <h1 id="fps-value">60</h1>
    </div>
    <div class="glass-display">
      <h3>Speed</h3>
        <div id="speed-display">
          <span id="speed-value" class="speed-number">1</span>
          <span class="speed-unit">gens/s</span>
        </div>
    </div>
  </div>
  <!-- === FOOTER ICONS === -->
  <div id="footer-icons">
    <!-- GitHub (bottom-left) -->
    <a
      id="github-link"
      href="https://github.com/Morpheus-Tech-LLC/morpheus-tech-web"
      target="_blank"
      aria-label="View source on GitHub"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="footer-icon"
      >
        <path
          d="M12 .5C5.7.5.6 5.6.6 12a11.5 11.5 0 0 0 7.9 10.9c.6.1.8-.3.8-.6v-2.1c-3.2.7-3.9-1.4-3.9-1.4-.5-1.2-1.2-1.5-1.2-1.5-1-.6.1-.6.1-.6 1.1.1 1.7 1.1 1.7 1.1 1 .1.7 2 .7 2 .9 1.6 2.7 1.2 3.3.9.1-.7.3-1.2.6-1.5-2.6-.3-5.3-1.3-5.3-6 0-1.3.5-2.3 1.1-3.1 0-.3-.5-1.5.1-3 0 0 1-.3 3.2 1.2a10.8 10.8 0 0 1 5.8 0c2.3-1.5 3.2-1.2 3.2-1.2.6 1.5.1 2.7.1 3 .6.8 1.1 1.8 1.1 3.1 0 4.7-2.7 5.6-5.3 6 .4.3.7 1 .7 2v3c0 .3.2.7.8.6A11.5 11.5 0 0 0 23.4 12C23.4 5.6 18.3.5 12 .5Z"
        />
      </svg>
    </a>

    <!-- Company (bottom-right) -->
    <div id="company-brand">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64"
        fill="currentColor"
        class="footer-icon"
      >
        <!-- Placeholder company logo — replace with your SVG path -->
        <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="4" fill="none" />
        <text x="32" y="38" text-anchor="middle" font-size="18" font-family="sans-serif" fill="currentColor">M</text>
      </svg>
      <span id="company-name">Morpheus Tech LLC</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: var(--color-background);
    font-family: sans-serif;
  }

  .arrow {
    font-size: 20px;
    opacity: 0.5;
    transition: opacity 0.3s, color 0.3s;
  }

  .arrow.active {
    opacity: 1;
    color: var(--color-control-active-icon);
    font-weight: bold;
  }

  #controls-time {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px; /* space above the mode buttons */
  }

  #controls {
    position: absolute;
    top: 10px;
    right: 10px; /* <-- move to right side */
    z-index: 10;
    background: var(--color-controls-background);
    padding: 12px;
    border-radius: 8px;
    min-width: 200px;
  }

  #speed-slider .slice-label::before {
    content: "Simulation Speed";
    display: block;
    text-align: center;
    color: var(--color-info-display-text);
    font-weight: 600;
    margin-bottom: 6px;
  }

  #speed-slider {
    margin-bottom: 10px;
  }

  #slider .slice-label::before {
    content: "2D Slice";
    display: block;
    text-align: center;
    color: var(--color-info-display-text);
    font-weight: 600;
    margin-bottom: 6px;
  }

  #controls label {
    display: block;
    margin-bottom: 6px;
  }

  #controls select,
  #controls input[type="range"] {
    width: 100%;
    margin-top: 4px;
  }

  #controls button {
    margin-right: 8px;
    /* background-color: blueviolet; */
  }

  /* Glass button style */
.glass-button {
  background: var(--color-control-inactive-background);
  border: 1px solid var(--color-control-border);
  border-radius: 12px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: background 0.3s, transform 0.2s;
}

.glass-button:hover {
  background: var(--color-control-hover);
  transform: scale(1.05);
}

  .glass-button:active {
    transform: translateY(0);
    box-shadow: 0 6px 18px var(--color-control-click);
  }

  /* === SLIDER STYLING === */
  .glass-slider {
    -webkit-appearance: none;
    width: 300px;
    height: 8px;
    border-radius: 10px;
    background: var(--color-control-inactive-background);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.3s ease;
  }

  .glass-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 18px;
    width: 18px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--color-control-font), var(--color-control-active-shadow));
    border: 1px solid rgba(255, 255, 255, 0.3);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .glass-slider::-webkit-slider-thumb:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 14px var(--color-control-hover);
  }

  .glass-display-container {
    position: fixed;
    flex-direction: row;
    display: flex;            /* put children side by side */
    top: 10px;
    left: 10px;
    gap: 12px;                /* space between displays */
    z-index: 20;  /* center horizontally (optional) */
    width: auto;      /* align vertically (optional) */
  }

  .glass-display {
    display: inline-block;
    height: auto;
    padding: 20px 24px;
    border-radius: 14px;
    margin-top:10px;
    margin-left:10px;
    margin: 10px;
    border: 1px solid var(--color-info-display-border);
    color: #cfd8e3;
    font-size: 15px;
    width: 100px;
    height:75px;
    text-align: center;
    user-select: none;
    pointer-events: none;
    transition: opacity 0.3s ease;
  } 

  .glass-display h3 {
    margin: 0 0 8px;
    font-size: 16px;
    color: var(--color-info-display-text);
    font-weight: 600;
  }

  .multi-section-button {
    display: flex;
    margin-top: 10px;
    border-radius: 0px;
    overflow: hidden;
    border: 1px solid var(--color-control-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: var(--color-control-inactive-background);
    cursor: pointer;
    transition: box-shadow 0.3s ease;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    }

  .multi-section-button:hover {
  box-shadow: 0 6px 14px var(--color-control-hover);
  }

  .state-section {
    flex: 1;
    padding: 12px 20px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: var(--color-control-font);
    transition: background 0.3s ease, color 0.3s ease;
    user-select: none;
  }

  .state-active-x .section-x,
  .state-active-y .section-y,
  .state-active-z .section-z {
    background: var(--color-control-active-background);
    color: var(--color-control-font);
  }

  .state-active-x .section-x {
    box-shadow: inset 0 0 10px var(--color-control-active-shadow);
  }

  /* .state-active-y .section-y {
    background: var(--color-background);
    color: #b4ffc5;
    box-shadow: inset 0 0 10px rgba(120, 255, 200, 0.2);
  } */

  /* .state-active-z .section-z {
    background: rgba(255, 180, 180, 0.15);
    color: #ffb4b4;
    box-shadow: inset 0 0 10px rgba(255, 140, 140, 0.2);
  } */

  #triStateButton {
    display: none;
  }

  #dualStateButton .section-y.active ~ #triStateButton {
    display: block;
  }

  #dualStateButton .section-y.active ~ #slider {
    display: block;
  }

  #dualStateButton .section-y.active ~ #sliceViewer {
    display: block;
  }

  #sliceViewer {
    display: none;
  }

  #slider {
    display: none;
    margin-bottom: 15px;
  }

  #playPauseIcon.play {
  display: inline-block;
  width: 0;
  height: 0;
  border-left: 26px solid currentColor;   /* triangle */
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
}

#playPauseIcon.pause {
  display: inline-block;
  width: 20px;
  height: 24px;
  position: relative;
}

#playPauseIcon.pause::before,
#playPauseIcon.pause::after {
  content: '';
  position: absolute;
  top: 0;
  width: 4px;
  height: 100%;
  background: currentColor;
}

#playPauseIcon.pause::before {
  left: 0;
}

#playPauseIcon.pause::after {
  right: 0;
}

#playPauseButton {
  width: 80px;
  height: 80px;
  font-size: 1rem;
  border-radius: 10%;
  cursor: pointer;
  pointer-events: auto; /* re-enable clicking */
}

.button-group {
  width: 200px
}

.slice-label {
  width: 150px;
  height: 20px;
  font-size: 1rem;
  border-radius: 50%;
  cursor: pointer;
}

.center-controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

#stepButton {
  width: 100px;
  height: 50px;
  font-size: 1.2rem;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto; /* centers horizontally inside flex column */
}


#stepButton.disabled {
  background: var(--color-control-disabled-background, #444); /* fallback color */
  opacity: 0.5;
  pointer-events: none;
  cursor: default;
}

#stepIcon {
  font-size: 24px;
}

#directionButton {
  width: 60px;
  height: 60px;
  font-size: 1.5rem;
  border-radius: 50%;
}

#directionIcon {
  font-size: 28px;
}

.control-group {
  display: flex;
  flex-direction: column;
  align-items: center; /* center everything horizontally */
  gap: 8px;
}

.top-row {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.bottom-row {
  display: flex;
  justify-content: center;
}

#clockCanvas {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 150px;
  height: 150px;
  pointer-events: none; /* let clicks go through to 3D scene */
}

#speed-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.1;
}

#speed-display .speed-number {
  font-size: 1.8rem;  /* same emphasis as before */
  font-weight: 600;
  color: #fff;        /* main highlight */
}

#speed-display .speed-unit {
  font-size: 0.85rem;          /* smaller, subtle text */
  color: var(--color-info-display-text);
  opacity: 0.8;
  margin-top: 4px;
}

/* === FOOTER ICONS === */
#footer-icons {
  position: fixed;
  bottom: 16px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  pointer-events: none; /* ensures they don't block 3D scene clicks */
  z-index: 50;
}

/* Enable pointer events only on links/buttons */
#footer-icons a,
#footer-icons #company-brand {
  pointer-events: auto;
}

.footer-icon {
  width: 36px;
  height: 36px;
  color: var(--color-info-display-text);
  opacity: 0.7;
  transition: opacity 0.3s ease, transform 0.2s ease;
}

.footer-icon:hover {
  opacity: 1;
  transform: scale(1.08);
  color: var(--color-control-font);
}

/* GitHub link positioning */
#github-link {
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

/* Company branding */
#company-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

#company-name {
  font-size: 0.95rem;
  color: var(--color-info-display-text);
  opacity: 0.8;
  font-weight: 500;
}

</style>
